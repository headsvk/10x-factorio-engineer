        <span class="power-exact">${fmtPower(totalPowMw * 1000)}</span>
        ${ceilDiffers ? `<span class="power-ceil-note" title="Power at whole built machine counts (fractional counts rounded up)">/ ${fmtPower(totalPowCeilMw * 1000)} rounded up</span>` : ''}
      </div>
    </div>` : '';

  if (!busSection && !powerSection && !nextSection) return `
    <div class="empty-state">
      <p>No production lines for ${esc(loc.label)} yet.</p>
      <p>Ask Claude to plan one in the Chat tab.</p>
    </div>`;

  return nextSection + busSection + powerSection;
}

function renderLinesTab() {
  const loc = currentLoc();
  const lines = loc.lines ?? [];
  if (!lines.length) return `
    <div class="empty-state">
      <p>No production lines yet.</p>
      <p>Ask Claude to plan one in the Chat tab.</p>
    </div>`;

  const idxMap = new Map(lines.map((l, i) => [l, i]));
  const buckets = Object.fromEntries(LINE_CATEGORY_ORDER.map(n => [n, []]));
  for (const line of lines) buckets[lineCategory(line)].push(line);
  const groups = LINE_CATEGORY_ORDER.map(name => [name, buckets[name]]);

  // Status filter counts (over all lines on this location, ignoring the search
  // box — chips are reset-to-status switches, not search refinements).
  const counts = {
    all:    lines.length,
    bad:    lines.filter(l => lineStatusBucket(l) === 'bad').length,
    warn:   lines.filter(l => lineStatusBucket(l) === 'warn').length,
    wip:    lines.filter(l => lineStatusBucket(l) === 'wip').length,
    stale:  lines.filter(l => lineStaleTechs(l).length > 0).length,
    capped: lines.filter(l => l.cli_result?.research_prod_capped === true).length,
  };
  const chip = (key, lbl) => {
    const n = counts[key];
    if (key !== 'all' && n === 0) return '';
    return `<button class="filter-chip${linesStatusFilter === key ? ' active' : ''}" data-status="${key}">${lbl}<span class="filter-chip-count">${n}</span></button>`;
  };

  // Expand/collapse-all label reflects current state.
  const toggleAllLabel = expandedCards.size > 0 ? 'Collapse all' : 'Expand all';

  const toolbar = `
    <div class="lines-toolbar">
      <div class="line-filter">
        <input type="text" id="line-filter-input" class="line-filter-input" autocomplete="off"
               placeholder="Filter lines… (press / to focus)" value="${esc(lineFilter)}" />
      </div>
      <div class="lines-filter-chips">
        ${chip('all',    'All')}
        ${chip('bad',    'Bad')}
        ${chip('warn',   'Warn')}
        ${chip('wip',    'WIP')}
        ${chip('stale',  'Stale')}
        ${chip('capped', '@300%')}
      </div>
      <button class="btn" id="btn-toggle-all">${toggleAllLabel}</button>
      <span class="lines-count" id="lines-count">${lines.length} ${lines.length === 1 ? 'line' : 'lines'}</span>
    </div>
    <div class="line-filter-empty" id="line-filter-empty" style="display:none">No lines match.</div>`;

  let html = toolbar;
  for (const [name, groupLines] of groups) {
    if (!groupLines.length) continue;
    html += `<div class="line-group" data-group="${esc(name)}" data-total="${groupLines.length}">
      <div class="lines-group-header">
        <div class="group-label">${name}</div>
        <span class="lines-group-count">${groupLines.length}</span>
      </div>
      ${groupLines.map(l => renderLineCard(l, idxMap.get(l))).join('')}
    </div>`;
  }
  return html;
}

// Status bucket for a line — drives both the status filter chips and the inline
// dot. 'wip' takes precedence; otherwise the rate-vs-target status applies.
function lineStatusBucket(line) {
  if (line.wip) return 'wip';
  const actual = line.effective_rate ?? line.target_rate ?? 0;
  return statusClass(pct(actual, line.target_rate ?? 0));
}

function lineCardMatchesStatus(card, filter) {
  if (filter === 'all')    return true;
  if (filter === 'stale')  return card.dataset.stale === '1';
  if (filter === 'capped') return card.dataset.capped === '1';
  return card.dataset.status === filter; // bad | warn | wip
}

// In-place Lines-tab filter — hides non-matching cards (and emptied groups)
// without re-rendering, so the search input keeps focus while typing. Applies
// both the text search and the active status filter, and refreshes the group /
// total counts.
function applyLineFilter() {
  const q = (lineFilter || '').trim().toLowerCase();
  let totalVisible = 0;
  let totalCards = 0;
  document.querySelectorAll('.line-group').forEach(group => {
    let groupVisible = 0;
    const cards = group.querySelectorAll('.line-card');
    cards.forEach(card => {
      const match = (!q || (card.dataset.filter || '').includes(q))
        && lineCardMatchesStatus(card, linesStatusFilter);
      card.style.display = match ? '' : 'none';
      if (match) groupVisible++;
    });
    totalCards += cards.length;
    totalVisible += groupVisible;
    group.style.display = groupVisible ? '' : 'none';
    const countEl = group.querySelector('.lines-group-count');
    if (countEl) {
      const total = +group.dataset.total || cards.length;
      countEl.textContent = groupVisible === total ? `${total}` : `${groupVisible} / ${total}`;
    }
  });
  const empty = document.getElementById('line-filter-empty');
  if (empty) empty.style.display = (totalCards && !totalVisible) ? 'block' : 'none';
  const countCap = document.getElementById('lines-count');
  if (countCap) {
    const filtering = q || linesStatusFilter !== 'all';
    countCap.textContent = filtering
      ? `${totalVisible} of ${totalCards}`
      : `${totalCards} ${totalCards === 1 ? 'line' : 'lines'}`;
  }
}

function renderLineCard(line, idx) {
  const actual = line.effective_rate ?? line.target_rate ?? 0;
  const p = pct(actual, line.target_rate ?? 0);
  const sc  = statusClass(p);
  const col = statusColor(p);
  const isOpen = expandedCards.has(idx);
  const steps  = line.cli_result?.production_steps ?? [];
  const belt       = line.cli_result?.belt;
  const beltsNeeded = line.cli_result?.belts_needed;
  const raw    = line.cli_result?.raw_resources ?? {};
  const miners = line.cli_result?.miners_needed ?? {};
  const isFluid = !!(line.fluid) || FLUID_ITEM_IDS.has(line.item);
  const fmtRate = (rate, beltName) => isFluid ? fmtFluid(rate) : fmtRB(rate, beltName);

  let body = '';
  if (isOpen) {
    const clir       = line.cli_result ?? {};
    const modCfgs      = clir.module_configs          ?? {};
    const beaconCfgs   = clir.beacon_configs          ?? {};
    const defaultBcn   = clir.default_beacon          ?? null;
    const recModOvr    = clir.recipe_module_overrides ?? {};
    const recBcnOvr    = clir.recipe_beacon_overrides ?? {};
    const housingQ     = clir.beacon_quality  ?? 'normal';
    const machineQ     = clir.machine_quality ?? 'normal';

    const machineRows = steps.map(s => {
      const stepPow = fmtPower(s.power_kw);
      const beaconPow = s.beacon_power_kw > 0 ? fmtPower(s.beacon_power_kw) : null;
      const powCell = stepPow
        ? (beaconPow ? `${stepPow} <span style="color:var(--text-dim)">+${beaconPow} beacon</span>` : stepPow)
        : '—';

      // Use the step's own effective module config (override-resolved AND
      // allow_productivity-filtered by the CLI) rather than the global
      // per-machine config — otherwise recipes that can't take prod modules
      // (e.g. pipe, allow_productivity=False) show phantom prod chips.
      const mods    = s.module_specs ?? [];
      const beacon  = recBcnOvr[s.recipe] ?? beaconCfgs[s.machine] ?? defaultBcn ?? null;
      const modHtml = mods.filter(m => m.count > 0).map(modChip).join(' ');
      const bcnHtml = beacon ? bcnChip(beacon, housingQ) : '';
      const bonusHtml = s.beacon_speed_bonus > 0
        ? `<span style="font-size:9px;color:var(--text-dim)">+${(s.beacon_speed_bonus * 100).toFixed(1)}%</span>`
        : '';
      const chipRow = [modHtml, bcnHtml, bonusHtml].filter(Boolean).join(' ');
      const qualDot = machineQ !== 'normal' ? `<span class="qdot q-${machineQ}">◆</span>` : '';

      const belt = STATE.preferred_belt;
      const inEntries = Object.entries(s.inputs ?? {});
      const outEntries = Object.entries(s.outputs ?? {});

      // Amber buffer badge per output: shown next to each output when --step-machines over-sizes a step.
      // excess_output_per_min is now a dict {item: rate} mirroring outputs, covering co-products too.
      const excessMap = s.excess_output_per_min ?? {};
      const mkItems = (entries, exMap) => entries.map(([item, rate]) => {
        const isF = FLUID_ITEM_IDS.has(item);
        const rateStr = isF ? fmtFluid(rate) : fmtRB(rate, belt);
        const ex = exMap?.[item] ?? 0;
        const ann = ex > 0
          ? `<span style="color:var(--warn);font-size:10px;font-weight:600;opacity:0.85;margin-left:4px" title="excess output buffered (forced ${s.forced_min_machines} machines)">+${fmtN(ex)}/m buf</span>`
          : '';
        return `<div class="step-io-item"><span class="step-io-name">${esc(label(item))}</span><span class="step-io-rate">${rateStr}${ann}</span></div>`;
      }).join('');
      const ioRow = (inEntries.length || outEntries.length) ? `<tr class="step-io-row"><td colspan="4" style="padding-top:0;padding-right:0"><div class="step-io-grid">
        <div class="step-io-col step-io-col--in"><div class="step-io-sect-label">Inputs</div>${mkItems(inEntries, {})}</div>
        <div class="step-io-col step-io-col--out"><div class="step-io-sect-label">Outputs</div>${mkItems(outEntries, excessMap)}</div>
      </div></td></tr>` : '';

      // Players build whole machines: lead with the ceil count, exact in parens.
      const mcExact = s.machine_count ?? 0;
      const mcCeil  = s.machine_count_ceil ?? Math.ceil(mcExact);
      const isFrac  = Math.abs(mcExact - Math.round(mcExact)) > 1e-4;
      const countCell = isFrac
        ? `${mcCeil} <span style="color:var(--text-dim)">(${fmtMC(mcExact)})</span>`
        : fmtMC(mcExact);

      return `<tr>
        <td>${esc(label(s.recipe))}</td>
        <td class="name-col"><span style="display:inline-flex;align-items:center;gap:3px;line-height:1">${esc(machineLabel(s.machine))}${qualDot}</span>${chipRow ? `<div style="margin-top:3px;line-height:1.8">${chipRow}</div>` : ''}</td>
        <td class="r">${countCell}</td>
        <td class="r" style="color:var(--text-dim)">${powCell}</td>
      </tr>${ioRow}`;
    }).join('');

    const totalPow = line.cli_result?.total_power_mw;
    const totalPowCeil = line.cli_result?.total_power_mw_ceil;
    const totalPowStr = totalPowCeil != null ? fmtPower(totalPowCeil * 1000) : null;

    const throttledBadge = clir.chain_throttled
      ? ` <span style="color:var(--bad);font-weight:400;font-size:10px;margin-left:8px" title="chain rate throttled to honor a --step-machines constraint below natural demand">throttled</span>`
      : '';
    const machineSection = steps.length ? `
      <div class="card-section">
        <div class="section-label">Machines${totalPowStr ? ` <span style="color:var(--text-dim);font-weight:400;font-size:10px;margin-left:8px" title="Power at whole built machine counts (fractional counts rounded up)">${totalPowStr} total</span>` : ''}${throttledBadge}</div>
        <table>
          <thead><tr><th>Recipe</th><th>Machine</th><th class="r">Count</th><th class="r">Power</th></tr></thead>
          <tbody>${machineRows}</tbody>
        </table>
      </div>` : '';

    // Aggregate machine, module and beacon totals across all steps
    const _machTotals = {};      // machine_key → total ceil count
    const _modTotals  = {};      // "type-tier-quality" → {m, total}
    const _bcnTotals  = {};      // machine_key → {bcn, machineTotal}
    for (const s of steps) {
      const mc = s.machine_count_ceil ?? 0;
      _machTotals[s.machine] = (_machTotals[s.machine] ?? 0) + mc;
      const sMods = (recModOvr[s.recipe] ?? modCfgs[s.machine] ?? []).filter(m => m.count > 0);
      for (const m of sMods) {
        const k = `${m.type}-${m.tier}-${m.quality ?? 'normal'}`;
        if (!_modTotals[k]) _modTotals[k] = { m, total: 0 };
        _modTotals[k].total += mc * m.count;
      }
      const bcn = recBcnOvr[s.recipe] ?? beaconCfgs[s.machine] ?? defaultBcn ?? null;
      if (bcn) {
        if (!_bcnTotals[s.machine]) _bcnTotals[s.machine] = { bcn, machineTotal: 0 };
        _bcnTotals[s.machine].machineTotal += mc;
      }
    }
    const _totChips = [
      ...Object.entries(_machTotals).map(([m, n]) =>
        `<span class="chip"><span style="font-weight:600;color:var(--text)">${n}×</span> <span style="color:var(--text-dim)">${esc(machineLabel(m))}</span></span>`),
      ...Object.values(_modTotals).map(({m, total}) => {
        const name = {prod:'Productivity',speed:'Speed',efficiency:'Efficiency'}[m.type] ?? m.type;
        const qStr = m.quality !== 'normal' ? ` (${m.quality})` : '';
        return `<span class="chip"><span style="font-weight:600;color:var(--text)">${total}×</span> <span style="color:var(--text-dim)">${name}-${m.tier}${qStr}</span></span>`;
      }),
      ...(Object.keys(_bcnTotals).length ? [(() => {
        const totalBcn = Object.values(_bcnTotals).reduce((s, {bcn, machineTotal}) => s + bcn.count * machineTotal, 0);
        return `<span class="chip"><span style="font-weight:600;color:var(--text)">${totalBcn}×</span> <span style="color:var(--text-dim)">Beacon</span></span>`;
      })()] : []),
    ].join('');
    const totalsSection = _totChips ? `
      <div class="card-section">
        <div class="section-label">Totals</div>
        <div class="chips">${_totChips}</div>
      </div>` : '';

    const busInputs = line.cli_result?.bus_inputs ?? {};
    const logiSet   = new Set(line.cli_args?.logistics_items ?? []);
    const directSet = new Set(line.cli_args?.direct_items ?? []);
    // Merged Inputs section — one row, each chip tagged with its source
    // (bus / bot / direct). Replaces the three sibling sections.
    const inputEntries = Object.entries(busInputs);
    const renderInputChip = ([r, rate]) => {
      const fmt = FLUID_ITEM_IDS.has(r) ? fmtFluid(rate) : fmtRB(rate, STATE.preferred_belt);
      const tag = logiSet.has(r)   ? '<span class="chip-tag" title="From logistics bots">bot</span>'
                : directSet.has(r) ? '<span class="chip-tag" title="Belt-fed directly from another line">direct</span>'
                : '<span class="chip-tag" title="From the main bus">bus</span>';
      return `<span class="chip">${tag}${esc(label(r))}: <span style="color:var(--text)">${fmt}</span></span>`;
    };
    const inputsSection = inputEntries.length ? `
      <div class="card-section">
        <div class="section-label">Inputs</div>
        <div class="chips">${inputEntries.map(renderInputChip).join('')}</div>
      </div>` : '';

    const reserveItems = line.reserve_items ?? [];
    const reserveSection = reserveItems.length ? `
      <div class="card-section">
        <div class="section-label">Reserve → Logistics</div>
        <div class="chips">${reserveItems.map(item => {
          const rate = reserveRateFor(line, item);
          const isF = FLUID_ITEM_IDS.has(item);
          const rateStr = rate > 0
            ? (isF ? fmtFluid(rate) : `${fmtN(rate)}/min`)
            : '0/min';
          const dim = rate > 0 ? '' : ' style="opacity:.5"';
          return `<span class="chip"${dim}>${esc(label(item))}: <span style="color:var(--ok)">+${rateStr}</span></span>`;
        }).join('')}</div>
      </div>` : '';

    // Merged Raws section — one chip per resource: rate · miner count · machine
    // · power. Items present in both raw_resources and miners_needed combine;
    // an item in only one still renders with whatever datum is available.
    const ownRaw    = Object.entries(raw);
    const ownMiners = Object.entries(miners);
    const allRawKeys = [...new Set([...ownRaw.map(([k]) => k), ...ownMiners.map(([k]) => k)])];
    const rawsSection = allRawKeys.length ? `
      <div class="card-section">
        <div class="section-label">Raws</div>
        <div class="chips">${allRawKeys.map(r => {
          const rate = raw[r];
          const info = miners[r];
          const rateFmt = rate != null
            ? (FLUID_ITEM_IDS.has(r) ? fmtFluid(rate) : fmtRB(rate, STATE.preferred_belt))
            : null;
          let minerStr = '';
          if (info) {
            const isYield = info.required_yield_pct != null;
            const count   = isYield ? `${info.required_yield_pct.toFixed(1)}% yield` : `${fmtMC(info.machine_count)}×`;
            const countCl = isYield ? 'var(--warn)' : 'var(--text)';
            const powStr  = info.power_kw ? fmtPower(info.power_kw) : null;
            const sep     = rateFmt ? ' · ' : '';
            minerStr = `${sep}<span style="color:${countCl};font-weight:600">${count}</span> <span style="color:var(--text-dim)">${esc(machineLabel(info.machine))}${powStr ? ` · ${powStr}` : ''}</span>`;
          }
          const rateStr = rateFmt ? `<span style="color:var(--text)">${rateFmt}</span>` : '';
          return `<span class="chip">${esc(label(r))}: ${rateStr}${minerStr}</span>`;
        }).join('')}</div>
      </div>` : '';

    // Outputs section — only render when there are co-products; the primary
    // rate is already shown in the card header.
    const coProds = Object.entries(line.cli_result?.co_products ?? {});
    const primaryRate = line.effective_rate ?? line.target_rate ?? 0;
    const primaryFmt = isFluid ? fmtFluid(primaryRate) : fmtRB(primaryRate, STATE.preferred_belt);
    const coProductSection = coProds.length ? `
      <div class="card-section">
        <div class="section-label">Outputs</div>
        <div class="chips">${[
          `<span class="chip">${esc(label(line.item))}: <span style="color:var(--ok)">${primaryFmt}</span></span>`,
          ...coProds.map(([r, rate]) => {
            const fmt = FLUID_ITEM_IDS.has(r) ? fmtFluid(rate) : fmtRB(rate, STATE.preferred_belt);
            return `<span class="chip">${esc(label(r))}: <span style="color:var(--ok)">${fmt}</span></span>`;
          })
        ].join('')}</div>
      </div>` : '';

    const noteSection = line.player_notes ? `
      <div class="player-notes">${esc(line.player_notes)}</div>` : '';

    const cliArgsSummary = summarizeCliArgs(line.cli_args);
    const cliArgsSection = cliArgsSummary ? `
      <div class="card-section">
        <div class="section-label">Sized by</div>
        <div class="chips"><span class="chip" style="font-family:var(--mono,monospace);color:var(--text-dim)">${esc(cliArgsSummary)}</span></div>
      </div>` : '';

    body = `<div class="card-body">${machineSection}${totalsSection}${coProductSection}${reserveSection}${inputsSection}${rawsSection}${cliArgsSection}${noteSection}</div>`;
  }

  const cardClass   = line.wip ? 'wip' : sc;
  const displayRate = actual;
  const stale = lineStaleTechs(line);
  const cappedHere = line.cli_result?.research_prod_capped === true;
  const chips = [
    stale.length ? `<span class="card-chip stale" title="Research changed since this line was planned: ${stale.map(t => PRODUCTIVITY_RESEARCH[t]?.label ?? t).join(', ')}">stale</span>` : '',
    cappedHere    ? `<span class="card-chip capped" title="A step on this line is at the +300% prod cap; more research levels won't reduce its machine count.">@300% cap</span>` : '',
  ].filter(Boolean).join(' ');
  // The WIP badge already marks in-progress lines — drop a redundant "(WIP)" in the label.
  const rawTitle  = line.label ?? label(line.item);
  const titleText = line.wip ? rawTitle.replace(/\s*\(wip\)\s*$/i, '') : rawTitle;
  // Subtitle only earns its row when it differs from the title.
  const itemName  = label(line.item);
  const subtitle  = itemName.trim().toLowerCase() !== titleText.trim().toLowerCase()
    ? `<span class="card-subtitle">${esc(itemName)}</span>` : '';
  // Show the target only when it differs from actual — "30 / 30/min" is noise.
  const target = line.target_rate ?? 0;
  const showTarget = target > 0 && Math.abs(displayRate - target) > 1e-9;
  // Filter key also covers machine + recipe names so "foundry" / "plastic" find lines.
  const filterKey = [
    titleText, itemName, line.item,
    ...steps.map(s => machineLabel(s.machine)),
    ...steps.map(s => label(s.recipe)),
  ].join(' ').toLowerCase();
  // Status bucket for the data-status attribute (drives the status filter chips).
  const dotClass = line.wip ? 'wip' : sc;
  return `
    <div class="line-card ${cardClass}" data-filter="${esc(filterKey)}"
         data-status="${dotClass}" data-stale="${stale.length ? 1 : 0}" data-capped="${cappedHere ? 1 : 0}">
      <div class="card-header ${cardClass}" data-card="${idx}" role="button" tabindex="0"
           aria-expanded="${isOpen}" title="${isOpen ? 'Collapse' : 'Expand'}">
        <div class="card-header-left">
          <span class="card-chevron">${isOpen ? '▼' : '▶'}</span>
          <div class="card-title-group">
            <span class="card-title">${esc(titleText)}${line.wip ? '<span class="wip-badge">WIP</span>' : ''}${chips ? ` ${chips}` : ''}</span>
            ${subtitle}
          </div>
        </div>
        <div class="card-header-rate">
          <span class="rate-num">${fmtN(displayRate)}${showTarget ? ` / ${fmtN(target)}` : ''}/min</span>
          <span class="rate-unit">${isFluid ? fmtFluidUnitOnly(displayRate) : fmtUnitOnly(displayRate, belt ?? STATE.preferred_belt)}</span>
        </div>
      </div>
      <div class="card-progress"><div class="card-progress-fill" style="width:${p}%;background:${line.wip ? 'var(--warn)' : col}"></div></div>
      ${body}
    </div>`;
}

function renderIssues() {
  const loc = currentLoc();
  const bn = loc.bottlenecks ?? [];
  const ns = loc.next_steps ?? [];
  if (!bn.length && !ns.length)
    return '<div class="no-issues">No bottlenecks or next steps.</div>';
  const parts = [];
  if (bn.length) {
    parts.push(`<div class="group-label" style="margin-bottom:8px">Bottlenecks</div>`);
    parts.push(...bn.map(b => `<div class="issue-item bad"><span>${esc(humanizeText(b))}</span></div>`));
  }
  if (ns.length) {
    parts.push(`<div class="group-label" style="margin:${bn.length ? '16px' : '0'} 0 8px">Next Steps</div>`);
    parts.push(...ns.map(s => `<div class="issue-item"><span style="color:var(--accent)">→</span><span>${esc(humanizeText(s))}</span></div>`));
  }
  return parts.join('');
}

function renderChat() {
  const avail = typeof window.claude?.complete === 'function';
  const warnDismissed = localStorage.getItem('chat_warn_dismissed') === '1';
  const warning = (avail || warnDismissed) ? '' : `<div class="chat-warning" style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><span>window.claude.complete is not available — sign into Claude.ai for chat to work.</span><button class="btn-cancel" style="padding:0 6px;height:auto;font-size:10px;flex-shrink:0" id="btn-dismiss-chat-warn">✕</button></div>`;
  const msgs = STATE.chat_log.length
    ? STATE.chat_log.map(e => `
        <div class="chat-msg ${e.from}">
          <div class="chat-bubble ${e.from}">
            <div class="chat-sender">${e.from === 'player' ? 'You' : 'Claude'}</div>
            <div class="chat-text">${esc(humanizeText(e.text))}</div>
          </div>
        </div>`).join('')
    : '<div class="chat-empty">No messages yet. Ask about your factory — strategy, machine counts, next steps.</div>';
  return `
    ${warning}
    <div class="chat-messages" id="chat-messages">${msgs}</div>
    <div class="chat-input-row">
      <textarea class="chat-textarea" id="chat-input" rows="2"
        placeholder="Ask about your factory… (Enter to send, Shift+Enter for newline)"
        ${chatSending || !avail ? 'disabled' : ''}></textarea>
      <button class="chat-send" id="btn-send" ${chatSending || !avail ? 'disabled' : ''}>
        ${chatSending ? '…' : 'Send'}
      </button>
    </div>`;
}

function render() {
  // Full innerHTML replace resets scroll; restore it so interactions don't jump the page.
  const scrollY = window.scrollY;
  // Research Bonuses is global config (applies to all surfaces/calcs), not per-location
  // status — it's embedded inside the Research Labs card (renderLabCard), since the lab
  // research levels directly drive that card's eSPM / lab-speed / lab-prod numbers.
  document.getElementById('app').innerHTML = `
    ${renderHeader()}
    <div class="main">
      <div class="main-inner">
        ${(s => s + (s ? '<hr class="loc-divider">' : ''))(renderScience())}
        ${(STATE.dataset ?? 'vanilla') !== 'vanilla' ? renderLocationBar() : ''}
        ${renderBottlenecks()}
        ${renderTabs()}
        <div class="tab-panel${activeTab==='overview' ?' active':''}">${renderOverview()}</div>
        <div class="tab-panel${activeTab==='lines'    ?' active':''}">${renderLinesTab()}</div>
        <div class="tab-panel${activeTab==='issues'   ?' active':''}">${renderIssues()}</div>
        <div class="tab-panel${activeTab==='chat'     ?' active':''}">${renderChat()}</div>
      </div>
    </div>`;
  bindEvents();
  applyLineFilter();  // re-apply Lines-tab filter after a full re-render (e.g. card expand)
  window.scrollTo(0, scrollY);
  if (activeTab === 'chat') scrollChat();
}

function scrollChat() {
  const el = document.getElementById('chat-messages');
  if (el) el.scrollTop = el.scrollHeight;
}

// ── Events ───────────────────────────────────────────────────────────────────

function bindEvents() {
  const tabBtns = [...document.querySelectorAll('.tab-btn')];
  tabBtns.forEach((btn, i) => {
    btn.addEventListener('click', () => { activeTab = btn.dataset.tab; render(); });
    btn.addEventListener('keydown', e => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      const next = tabBtns[(i + (e.key === 'ArrowRight' ? 1 : tabBtns.length - 1)) % tabBtns.length];
      next.focus(); next.click();
    });
  });

  // Keyboard activation for div-based buttons (card headers, toggles, banner, rollup rows)
  document.querySelectorAll('[role="button"][tabindex]').forEach(el =>
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
    }));

  document.getElementById('science-toggle')?.addEventListener('click', () => {
    scienceOpen = !scienceOpen;
    localStorage.setItem('science_open', scienceOpen ? '1' : '0');
    render();
  });

  document.getElementById('banner-actions')?.addEventListener('click', () => {
    activeTab = 'issues';
    render();
  });

  document.querySelectorAll('[data-goto-tab]').forEach(el =>
    el.addEventListener('click', () => { activeTab = el.dataset.gotoTab; render(); }));

  document.querySelectorAll('.loc-btn[data-locidx]').forEach(btn =>
    btn.addEventListener('click', () => {
      activeLocationIdx = +btn.dataset.locidx;
      expandedCards = new Set();
      render();
    }));

  document.querySelectorAll('.card-header[data-card]').forEach(hdr =>
    hdr.addEventListener('click', e => {
      const idx = +hdr.dataset.card;
      expandedCards.has(idx) ? expandedCards.delete(idx) : expandedCards.add(idx);
      render();
    }));

  // Lines-tab filter: filter in place (no re-render) so the input keeps focus while typing.
  const filterInput = document.getElementById('line-filter-input');
  if (filterInput) {
    filterInput.addEventListener('input', () => {
      lineFilter = filterInput.value;
      applyLineFilter();
    });
    filterInput.addEventListener('keydown', e => {
      if (e.key === 'Escape') { lineFilter = ''; filterInput.value = ''; applyLineFilter(); }
    });
  }

  // Status filter chips — toggle on/off (re-click the active chip to clear).
  document.querySelectorAll('.filter-chip[data-status]').forEach(btn =>
    btn.addEventListener('click', () => {
      const key = btn.dataset.status;
      linesStatusFilter = linesStatusFilter === key ? 'all' : key;
      render();
    }));

  // Expand-all / collapse-all toggle over every line on the current location.
  document.getElementById('btn-toggle-all')?.addEventListener('click', () => {
    const lns = currentLoc().lines ?? [];
    expandedCards = expandedCards.size > 0 ? new Set() : new Set(lns.map((_, i) => i));
    render();
  });

  document.getElementById('research-toggle')?.addEventListener('click', () => {
    researchOpen = !researchOpen;
    render();
  });

  document.querySelectorAll('.research-input[data-research]').forEach(input =>
    input.addEventListener('change', () => {
      const key = input.dataset.research;
      const lvl = Math.max(0, parseInt(input.value, 10) || 0);
      STATE.research_levels = STATE.research_levels ?? {};
      if (lvl > 0) STATE.research_levels[key] = lvl;
      else         delete STATE.research_levels[key];
      saveState();
      render();
    }));

  // Research cycle time picker — the only interactive lab control. The rest of
  // lab_config is state-driven (player asks Claude to update it).
  document.querySelectorAll('select[data-lab="research_cycle_time"]').forEach(el =>
    el.addEventListener('change', () => {
      STATE.lab_config = STATE.lab_config ?? { ...DEFAULT_STATE.lab_config };
      STATE.lab_config.research_cycle_time = Math.max(1, parseInt(el.value, 10) || 60);
      saveState();
      render();
    }));

  const btnExport = document.getElementById('btn-export');
  if (btnExport) btnExport.addEventListener('click', () => {
    document.getElementById('export-text').value = encodeState(STATE);
    document.getElementById('export-dialog').showModal();
  });

  const btnImport = document.getElementById('btn-import');
  if (btnImport) btnImport.addEventListener('click', () => {
    document.getElementById('import-text').value = '';
    document.getElementById('import-error').textContent = '';
    document.getElementById('import-dialog').showModal();
  });

  const btnTheme = document.getElementById('btn-theme');
  if (btnTheme) btnTheme.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme')
      || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    const next = cur === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    render();
  });

  const btnReset = document.getElementById('btn-reset');
  if (btnReset) btnReset.addEventListener('click', () => {
    if (confirm('Reset all factory data? This cannot be undone.')) {
      STATE = { ...DEFAULT_STATE }; activeLocationIdx = 0; saveState(); render();
    }
  });

  const btnDismissChatWarn = document.getElementById('btn-dismiss-chat-warn');
  if (btnDismissChatWarn) btnDismissChatWarn.addEventListener('click', () => {
    localStorage.setItem('chat_warn_dismissed', '1');
    render();
  });

  const btnSend  = document.getElementById('btn-send');
  const chatArea = document.getElementById('chat-input');
  if (btnSend)  btnSend.addEventListener('click', sendChat);
  if (chatArea) chatArea.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });
}

// ── Chat ─────────────────────────────────────────────────────────────────────

function buildPrompt(userMessage) {
  const { chat_log: _, ...stateForPrompt } = STATE;
  const history = STATE.chat_log.slice(-10).map(m => `${m.from === 'player' ? 'PLAYER' : 'CLAUDE'}: ${m.text}`).join('\n');
  return `${SYSTEM_PROMPT}\n\nCURRENT FACTORY STATE:\n${JSON.stringify(stateForPrompt, null, 2)}\n\nCONVERSATION:\n${history}\nPLAYER: ${userMessage}\n\nCLAUDE:`;
}

function parseResponse(response) {
  const match = response.match(/```json\s*([\s\S]*?)\s*```/);
  if (!match) return { text: response.trim(), newState: null };
  const text = response.replace(/```json[\s\S]*?```/, '').trim();
  try { return { text, newState: JSON.parse(match[1]) }; } catch { return { text: response.trim(), newState: null }; }
}

async function sendChat() {
  if (chatSending) return;
  const input = document.getElementById('chat-input');
  const text = input?.value.trim();
  if (!text) return;
  input.value = '';
  chatSending = true;

  const fullLog = [...STATE.chat_log, { from: 'player', text }];
  STATE = { ...STATE, chat_log: fullLog };
  render(); scrollChat();

  try {
    if (!window.claude?.complete) throw new Error('window.claude.complete not available');
    const response = await window.claude.complete(buildPrompt(text));
    const { text: replyText, newState } = parseResponse(response);
    const replyLog = [...fullLog, { from: 'claude', text: replyText || '(state updated)' }];
    STATE = newState ? { ...newState, chat_log: replyLog } : { ...STATE, chat_log: replyLog };
    await saveState();
  } catch (e) {
    STATE = { ...STATE, chat_log: [...fullLog, { from: 'claude', text: `Error: ${e.message}` }] };
  } finally {
    chatSending = false;
    render(); scrollChat();
  }
}

// ── Export / Import dialogs (outside render cycle) ───────────────────────────

document.getElementById('export-close').addEventListener('click', () =>
  document.getElementById('export-dialog').close());
document.getElementById('export-copy').addEventListener('click', () =>
  navigator.clipboard.writeText(document.getElementById('export-text').value));

document.getElementById('import-cancel').addEventListener('click', () =>
  document.getElementById('import-dialog').close());

document.getElementById('import-apply').addEventListener('click', () => {
  const text = document.getElementById('import-text').value.trim();
  try {
    STATE = migrateState(decodeState(text));
    activeLocationIdx = 0;
    saveState();
    document.getElementById('import-dialog').close();
    render();
  } catch (e) {
    document.getElementById('import-error').textContent = 'Invalid data: ' + e.message;
  }
});

// ── Init ─────────────────────────────────────────────────────────────────────

(async () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  await checkStorage();
  const saved = await loadState();
  if (saved) STATE = saved;
  const params = new URLSearchParams(location.search);
  const tabParam = params.get('tab');
  if (tabParam && ['overview','lines','issues','chat'].includes(tabParam)) activeTab = tabParam;
  if (params.get('expand') === 'all') {
    expandedCards = new Set((currentLoc().lines ?? []).map((_, i) => i));
  }

  // Global keyboard shortcuts (bound once; ignored while typing in a field).
  //   /      focus the Lines-tab filter (switches to Lines if elsewhere)
  //   n / j  scroll the next visible card into view; p / k previous
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = (e.target?.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || e.target?.isContentEditable) return;

    if (e.key === '/') {
      e.preventDefault();
      if (activeTab !== 'lines') { activeTab = 'lines'; render(); }
      document.getElementById('line-filter-input')?.focus();
      return;
    }
    if (activeTab === 'lines' && (e.key === 'n' || e.key === 'j' || e.key === 'p' || e.key === 'k')) {
      const cards = [...document.querySelectorAll('.line-card')].filter(c => c.style.display !== 'none');
      if (!cards.length) return;
      e.preventDefault();
      const dir = (e.key === 'n' || e.key === 'j') ? 1 : -1;
      const tops = cards.map(c => c.getBoundingClientRect().top + window.scrollY);
      const cy = window.scrollY + 24;
      let cur = -1;
      for (let i = 0; i < tops.length; i++) { if (tops[i] <= cy + 4) cur = i; else break; }
      const targetIdx = Math.max(0, Math.min(cards.length - 1, cur + dir));
      cards[targetIdx]?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });

  render();
})();
</script>
