<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10x Factorio Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── Theme variables: dark (default) ── */
    :root {
      --bg:           #100f09;
      --bg-card:      #1c1a11;
      --bg-input:     #252318;
      --border:       #342f1c;
      --border-sub:   #28241a;
      --text:         #ece7d2;
      --text-muted:   #8a7f64;
      --text-dim:     #6e6450;
      --accent:       #f59e0b;
      --accent-hover: #fbbf24;
      --accent-contrast: #1c1508;
      --ok:           #4ade80;
      --ok-bg:        rgba(74,222,128,.07);
      --ok-border:    rgba(74,222,128,.2);
      --warn:         #fbbf24;
      --warn-bg:      rgba(251,191,36,.09);
      --warn-border:  rgba(251,191,36,.25);
      --bad:          #f87171;
      --bad-bg:       rgba(248,113,113,.09);
      --bad-border:   rgba(248,113,113,.25);
      font-family: 'Barlow Condensed', system-ui, sans-serif;
    }

    /* ── Light theme ── */
    [data-theme="light"] {
      --bg:           #faf9f2;
      --bg-card:      #fffcf0;
      --bg-input:     #e6dcc0;
      --border:       #d4c89e;
      --border-sub:   #ebe2c6;
      --text:         #1c1608;
      --text-muted:   #6b5f42;
      --text-dim:     #6b5e40;
      --accent:       #b45309;
      --accent-hover: #92400e;
      --accent-contrast: #fff8eb;
      --ok:           #16a34a;
      --ok-bg:        rgba(22,163,74,.10);
      --ok-border:    rgba(22,163,74,.30);
      --warn:         #d97706;
      --warn-bg:      rgba(217,119,6,.10);
      --warn-border:  rgba(217,119,6,.30);
      --bad:          #dc2626;
      --bad-bg:       rgba(220,38,38,.10);
      --bad-border:   rgba(220,38,38,.28);
    }

    /* ── Respect OS preference when no manual override ── */
    @media (prefers-color-scheme: light) {
      :root:not([data-theme]) {
        --bg:           #faf9f2;
        --bg-card:      #fffcf0;
        --bg-input:     #e6dcc0;
        --border:       #d4c89e;
        --border-sub:   #ebe2c6;
        --text:         #1c1608;
        --text-muted:   #6b5f42;
        --text-dim:     #6b5e40;
        --accent:       #b45309;
        --accent-hover: #92400e;
        --accent-contrast: #fff8eb;
        --ok:           #16a34a;
        --ok-bg:        rgba(22,163,74,.10);
        --ok-border:    rgba(22,163,74,.30);
        --warn:         #d97706;
        --warn-bg:      rgba(217,119,6,.10);
        --warn-border:  rgba(217,119,6,.30);
        --bad:          #dc2626;
        --bad-bg:       rgba(220,38,38,.10);
        --bad-border:   rgba(220,38,38,.28);
      }
    }

    body { background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; overflow-y: scroll; }

    /* ── Layout ── */
    .header {
      border-bottom: 1px solid var(--border-sub);
      padding: 10px 16px;
      background: var(--bg-card);
    }
    .header-inner {
      max-width: 1280px; margin-inline: auto;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 8px;
    }
    .header-left { display: flex; flex-direction: column; gap: 2px; }
    .header-title-row { display: flex; align-items: center; gap: 8px; }
    .header-title { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 900;
                    color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
    .header-save  { font-size: 12px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .main { padding: 16px; }
    .main-inner { max-width: 1280px; margin-inline: auto; }

    /* ── Storage pill ── */
    .storage-pill { font-size: 10px; border: 1px solid; border-radius: 3px; padding: 0 8px;
                    height: 28px; display: inline-flex; align-items: center; line-height: 1;
                    font-family: 'JetBrains Mono', monospace; letter-spacing: .02em; }
    .storage-pill.cloud { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
    .storage-pill.local { background: transparent; color: var(--text-muted); border-color: var(--border); }
    .storage-pill.none  { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-border); }

    /* ── Badges ── */
    .badges { display: flex; gap: 4px; flex-wrap: wrap; }
    .badge { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700;
             letter-spacing: .05em; text-transform: uppercase;
             border: 1px solid var(--border); border-radius: 3px; padding: 1px 7px; color: var(--text-muted); }
    .badge.purple { border-color: rgba(139,92,246,.4); color: #c084fc; background: rgba(88,28,135,.15); }

    /* ── Buttons ── */
    button { cursor: pointer; border: none; font-family: 'Barlow Condensed', sans-serif;
             font-size: 13px; font-weight: 700; letter-spacing: .05em;
             display: inline-flex; align-items: center; gap: 4px; transition: background .15s, color .15s; }
    .btn-group { display: flex; gap: 4px; }
    .btn       { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted);
                 border-radius: 3px; padding: 3px 10px; height: 28px; text-transform: uppercase; }
    .btn:hover { background: var(--border); color: var(--text); }
    .btn-ghost { background: transparent; border: none; color: var(--text-dim);
                 border-radius: 3px; padding: 3px 8px; height: 28px; }
    .btn-ghost:hover { background: var(--bg-input); color: var(--text); }
    .btn-ghost.danger { text-transform: uppercase; }
    .btn-ghost.danger:hover { background: var(--bad-bg); color: var(--bad); }
    .btn-primary { background: var(--accent); border: none; color: var(--accent-contrast);
                   border-radius: 3px; padding: 4px 16px; font-weight: 900; text-transform: uppercase; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    .btn-cancel { background: transparent; border: none; color: var(--text-muted);
                  border-radius: 3px; padding: 4px 12px; text-transform: uppercase; }
    .btn-cancel:hover { background: var(--bg-input); }

    /* ── Section label (two tiers) ── */
    /* sub-label: column headers, card meta, inline labels */
    .section-label { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700;
                     text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 10px; }
    /* group-label: top-level group headings (Science Targets, Bus Balance, Bottlenecks, etc.) */
    .group-label { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700;
                   text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted);
                   margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border-sub); }

    /* ── Science section ── */
    .science-section { background: var(--bg-card); border: 1px solid var(--border-sub);
                       border-left: 3px solid var(--accent);
                       border-radius: 4px; padding: 14px 16px; margin-bottom: 10px; }
    .loc-divider { border: none; border-top: 1px solid var(--border-sub); margin: 0 0 10px; }
    .science-header { display: flex; align-items: center; justify-content: space-between;
                      cursor: pointer; user-select: none;
                      font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700;
                      text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted);
                      margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .science-header.open { margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border-sub); }
    .science-header-main { display: flex; align-items: center; gap: 8px; }
    .science-summary { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
                       letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
    .science-grid.cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
    .science-bar { margin-bottom: 12px; }
    .science-bar:last-child { margin-bottom: 0; }
    .science-bar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .science-name { display: flex; align-items: center; gap: 8px; font-family: 'Barlow Condensed', sans-serif;
                    font-size: 14px; font-weight: 700; letter-spacing: .02em; color: var(--text); }
    .sci-swatch   { flex-shrink: 0; width: 10px; height: 10px; border-radius: 2px; }
    .science-meta { display: flex; align-items: center; gap: 12px; }
    .rate-text    { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .pct-text     { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; width: 36px; text-align: right; }
    /* Bar sizing: --bar-primary (science targets), --bar-unit (all other bars) */
    :root { --bar-primary: 10px; --bar-unit: 4px; }
    .progress-track { height: var(--bar-primary); background: var(--bg-input); border-radius: 3px; overflow: hidden; }
    .progress-fill  { height: 100%; border-radius: 3px; transition: width .5s ease; }

    /* ── Research section ── */
    .research-section { background: var(--bg-card); border: 1px solid var(--border-sub);
                        border-left: 3px solid var(--accent);
                        border-radius: 4px; padding: 10px 16px; margin-bottom: 10px; }
    .research-header  { display: flex; align-items: center; justify-content: space-between;
                        margin-bottom: 0; cursor: pointer; user-select: none;
                        font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700;
                        text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); }
    .research-header-main { display: flex; align-items: center; gap: 8px; }
    .research-chevron { color: var(--text-dim); font-size: 10px; }
    .research-count-pill { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500;
                           color: var(--text-dim); background: var(--bg-input); border-radius: 3px;
                           padding: 1px 7px; letter-spacing: 0; text-transform: none; }
    .research-body    { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-sub); }
    .research-grid    { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
    .research-row     { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .research-label   { font-family: 'Barlow Condensed', sans-serif; font-size: 13px;
                        color: var(--text); letter-spacing: .02em; }
    .research-input   { width: 58px; text-align: right; background: var(--bg-input);
                        border: 1px solid var(--border); border-radius: 3px;
                        color: var(--text); font-family: 'JetBrains Mono', monospace;
                        font-size: 12px; padding: 2px 6px; height: 24px; }
    .research-input:focus { outline: none; border-color: var(--accent); }
    .research-subgroup-label { grid-column: 1 / -1; font-family: 'Barlow Condensed', sans-serif;
                               font-size: 10px; font-weight: 800; text-transform: uppercase;
                               letter-spacing: .12em; color: var(--text-dim); margin-top: 4px; }
    /* Research Bonuses embedded inside the lab card — strip its own card chrome, separate with a divider */
    .lab-research { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-sub); }
    .lab-research .research-section { background: none; border: none; border-radius: 0;
                                      padding: 0; margin-bottom: 0; }

    /* Line-card research chips (stale / capped) */
    .card-chip { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
                 text-transform: uppercase; letter-spacing: .05em; border-radius: 3px;
                 padding: 1px 6px; border: 1px solid; display: inline-flex; align-items: center; }
    .card-chip.stale  { color: var(--warn); border-color: var(--warn-border); background: var(--warn-bg); }
    .card-chip.capped { color: var(--warn); border-color: var(--warn-border); background: var(--warn-bg); }

    /* ── Bottleneck banner (one-line summary; full lists live in the Actions tab) ── */
    .bottleneck-banner { background: var(--bad-bg); border: 1px solid var(--bad-border);
                         border-left: 3px solid var(--bad);
                         border-radius: 4px; padding: 10px 16px; margin-bottom: 16px;
                         display: flex; align-items: center; justify-content: space-between;
                         gap: 8px; cursor: pointer; user-select: none; }
    .bottleneck-banner:hover { background: var(--bad-border); }
    .bottleneck-title { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 800;
                        letter-spacing: .05em; text-transform: uppercase; color: var(--bad); }
    .bottleneck-go    { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700;
                        letter-spacing: .05em; text-transform: uppercase; color: var(--bad); opacity: .7; }

    /* ── Tabs ── */
    .tab-list { display: flex; flex-wrap: wrap; background: var(--bg-card); border: 1px solid var(--border-sub);
                border-radius: 4px; padding: 2px; margin-bottom: 16px; gap: 2px; }
    .tab-btn  { background: transparent; border: none; color: var(--text-muted);
                border-radius: 3px; padding: 4px 14px; height: 28px;
                font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700;
                letter-spacing: .05em; text-transform: uppercase; }
    .tab-btn.active             { background: var(--accent); color: var(--accent-contrast); }
    .tab-btn:hover:not(.active) { background: var(--bg-input); }
    .tab-panel                  { display: none; }
    .tab-panel.active           { display: block; }

    /* ── SPM headline ── */
    .spm-headline { display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; }
    .spm-number   { font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 700;
                    font-variant-numeric: tabular-nums; line-height: 1; }
    .spm-target   { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 500;
                    font-variant-numeric: tabular-nums; line-height: 1; color: var(--text-muted); }
    .spm-sep      { font-family: 'JetBrains Mono', monospace; font-size: 24px; color: var(--text-dim); line-height: 1; }
    .spm-label    { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 900;
                    letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
    .spm-arrow    { font-family: 'JetBrains Mono', monospace; font-size: 18px; color: var(--text-dim); line-height: 1; }
    .spm-espm     { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700;
                    font-variant-numeric: tabular-nums; line-height: 1; color: var(--accent); }
    .spm-limiter  { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700;
                    letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted);
                    align-self: center; margin-left: 4px; }

    /* ── Research-lab card ── */
    .lab-card   { background: var(--bg-input); border: 1px solid var(--border-sub);
                  border-radius: 4px; padding: 10px 12px; margin-top: 12px; }
    .lab-card-head { display: flex; align-items: center; justify-content: space-between;
                     gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .lab-card-title { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 800;
                      text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); }
    .lab-card-count { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: var(--text); }
    .lab-config-row { display: flex; align-items: center; justify-content: space-between;
                      gap: 8px 16px; flex-wrap: wrap; margin-bottom: 10px; }
    .lab-config-summary { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); }
    .lab-stats  { display: flex; flex-wrap: wrap; gap: 8px 16px; }
    .lab-stat   { display: flex; flex-direction: column; gap: 1px; }
    .lab-stat-k { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
                  text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); }
    .lab-stat-v { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
                  color: var(--text); font-variant-numeric: tabular-nums; }
    .lab-ctl    { display: flex; align-items: center; gap: 5px; }
    .lab-ctl-l  { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700;
                  text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); }
    .lab-select { background: var(--bg-card); border: 1px solid var(--border); border-radius: 3px;
                  color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 11px;
                  padding: 2px 5px; height: 24px; }
    .lab-select:focus { outline: none; border-color: var(--accent); }

    /* ── Overview rollups ── */
    .overview-section { margin-bottom: 16px; }
    .overview-rollup { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .rollup-stat { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700;
                   font-variant-numeric: tabular-nums; }
    .overview-link { background: none; border: none; padding: 0; color: var(--text-dim);
                     font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700;
                     letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
    .overview-link:hover { color: var(--text); }

    /* ── Bus balance ── */
    .bus-section { margin-bottom: 16px; }
    .bus-group { margin-bottom: 12px; }
    .bus-group:last-child { margin-bottom: 0; }
    .bus-group-label { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 800;
                       text-transform: uppercase; letter-spacing: .12em; margin-bottom: 7px;
                       padding-left: 2px; }
    .bus-group-label--belt { color: var(--accent); border-bottom: 1px solid var(--border-sub); padding-bottom: 4px; }
    .bus-group-label--pipe { color: #5b9fd4; border-bottom: 1px solid var(--border-sub); padding-bottom: 4px; }
    .bus-group-label--logi { color: #4aa896; border-bottom: 1px solid var(--border-sub); padding-bottom: 4px; }
    /* Dense responsive grid — fills width, rows sorted tightest-first so problems surface top-left */
    .bus-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(216px, 1fr)); gap: 6px; }
    .bus-row { padding: 7px 9px 8px; border-radius: 4px; border: 1px solid var(--border-sub);
               border-left: 3px solid var(--ok); background: var(--bg-card); cursor: default;
               transition: border-color .15s; }
    .bus-row--warn { border-left-color: var(--warn); }
    .bus-row--bad  { border-left-color: var(--bad); }
    .bus-row:hover { border-color: var(--border); }
    .bus-row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
                   margin-bottom: 6px; }
    .bus-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px;
                letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bus-net { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700;
               font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0; }
    .bus-net-unit { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 800;
                    letter-spacing: .06em; text-transform: uppercase; opacity: .5; margin-left: 3px; }
    .bus-row-bot { display: flex; align-items: center; gap: 8px; }
    /* Filled portion = consumption (colored by load severity); track = free headroom */
    .bus-bar-track { flex: 1; height: var(--bar-unit); border-radius: 3px; overflow: hidden;
                     background: var(--bg-input); }
    .bus-bar-consumed { height: 100%; border-radius: 3px; transition: width .4s ease, background .4s ease; }
    .bus-loadpct { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
                   font-variant-numeric: tabular-nums; min-width: 30px; text-align: right; }

    .empty-state code { font-family: 'JetBrains Mono', monospace; font-size: 11px;
                        background: var(--bg-input); border: 1px solid var(--border-sub);
                        border-radius: 2px; padding: 0 4px; color: var(--text-muted); }

    /* ── Line cards ── */
    /* Capped width — the expanded step table only needs ~540px, so a full-width card just
       leaves dead space. Capping it keeps cards tidy and the right-aligned rate close + aligned. */
    .line-card { border-radius: 4px; border: 1px solid; background: var(--bg-card); margin-bottom: 8px;
                 overflow: hidden; max-width: 640px; }
    .line-card.ok   { border-color: var(--ok-border);   border-left: 3px solid var(--ok);   }
    .line-card.warn { border-color: var(--warn-border);  border-left: 3px solid var(--warn);  }
    .line-card.bad  { border-color: var(--bad-border);   border-left: 3px solid var(--bad);   }
    .line-card.wip  { border-color: var(--warn-border);  border-left: 3px dashed var(--warn); }
    .line-card.wip .card-header { opacity: .75; }
    .wip-badge { display: inline-flex; align-items: center; font-family: 'Barlow Condensed', sans-serif;
                 font-size: 9px; font-weight: 700; letter-spacing: .08em; color: var(--warn);
                 background: var(--warn-bg); border: 1px solid var(--warn-border);
                 padding: 1px 5px; border-radius: 3px; margin-left: 5px; vertical-align: middle; flex-shrink: 0; }

    .card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
                   padding: 10px 16px; cursor: pointer; user-select: none;
                   background: var(--bg-card); transition: background .12s; }
    .card-header:hover { background: var(--bg-input); }
    .card-header-left  { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .card-title-group  { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .card-subtitle     { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 600;
                         text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); }
    .card-chevron      { color: var(--text-muted); font-size: 12px; width: 14px; transition: transform .15s ease; }
    .card-header:hover .card-chevron { color: var(--text); }
    .card-title        { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px;
                         letter-spacing: .02em; color: var(--text); }
    .card-header-rate { display: flex; flex-direction: column; align-items: flex-end; gap: 1px;
                        flex-shrink: 0; }
    /* Lines-tab filter box */
    .line-filter { margin-bottom: 4px; }
    .line-filter-input { width: 100%; max-width: 280px; box-sizing: border-box;
                         background: var(--bg-input); border: 1px solid var(--border);
                         border-radius: 4px; color: var(--text);
                         font-family: 'Barlow Condensed', sans-serif; font-size: 14px;
                         letter-spacing: .02em; padding: 6px 10px; }
    .line-filter-input:focus { outline: none; border-color: var(--accent); }
    .line-filter-input::placeholder { color: var(--text-dim); }
    .line-filter-empty { margin-top: 10px; color: var(--text-dim);
                         font-family: 'Barlow Condensed', sans-serif; font-size: 13px;
                         letter-spacing: .04em; }

    /* ── Lines toolbar: search + status filter chips + expand-all ── */
    .lines-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .lines-toolbar .line-filter { margin-bottom: 0; flex: 1 1 220px; min-width: 180px; max-width: 320px; }
    .lines-toolbar .line-filter-input { max-width: none; }
    .lines-filter-chips { display: flex; gap: 4px; flex-wrap: wrap; }
    .filter-chip { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted);
                   border-radius: 3px; padding: 3px 9px; height: 30px;
                   font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700;
                   letter-spacing: .05em; text-transform: uppercase; cursor: pointer;
                   transition: background .12s, color .12s, border-color .12s;
                   display: inline-flex; align-items: center; gap: 5px; }
    .filter-chip:hover:not(.active) { background: var(--border); color: var(--text); }
    .filter-chip.active { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
    .filter-chip-count { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500;
                         color: var(--text-dim); letter-spacing: 0; }
    .filter-chip.active .filter-chip-count { color: var(--accent-contrast); opacity: .85; }
    .lines-count { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim);
                   margin-left: auto; white-space: nowrap; }

    /* ── Sticky Lines group header (visible / total counts) ── */
    .lines-group-header { position: sticky; top: 0; z-index: 2; background: var(--bg);
                          margin: 12px 0 8px; padding: 4px 0;
                          display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .line-group:first-child .lines-group-header { margin-top: 0; }
    .lines-group-header .group-label { margin: 0; padding-bottom: 4px; flex: 1; }
    .lines-group-count { font-family: 'JetBrains Mono', monospace; font-size: 10px;
                         color: var(--text-dim); letter-spacing: 0; padding-bottom: 4px;
                         border-bottom: 1px solid var(--border-sub); }

    /* ── Merged Inputs chip: source tag (bus / bot / direct) ── */
    .chip-tag { display: inline-block; margin-right: 5px; font-size: 9px; font-weight: 700;
                text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); }
    .rate-num  { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted);
                 font-variant-numeric: tabular-nums; }
    .rate-unit { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim);
                 font-variant-numeric: tabular-nums; }
    .item-label { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600;
                  text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); }
    /* Quiet footer stat — not a card; a low-emphasis summary line below Bus Balance */
    .power-overview { display: flex; align-items: baseline; gap: 8px; padding: 2px;
                      margin-top: 2px; }
    .power-overview-label { font-family: 'Barlow Condensed', sans-serif; font-size: 11px;
                            font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
                            color: #c8a840; }
    .power-overview-values { display: flex; align-items: baseline; gap: 6px; }

    .card-progress      { height: var(--bar-unit); background: var(--bg-input); }
    .card-progress-fill { height: 100%; transition: width .5s; }
    .card-body { padding: 14px 16px; }
    .card-section { margin-bottom: 16px; }
    .card-section:last-child { margin-bottom: 0; }

    table { width: 100%; font-size: 12px; border-collapse: collapse; }

    thead tr { border-bottom: 1px solid var(--border-sub); }

                    white-space: nowrap; flex-shrink: 0; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }

    /* ── Module & beacon chips ── */
    .mod-chip {
      display: inline-flex; align-items: center; gap: 1px;

    /* ── Issues ── */
    /* Pending actions use a neutral accent palette — green reads as "done". */
    .issue-item { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px;

    .issue-item.good { background: var(--ok-bg);   border: 1px solid var(--ok-border);

    .chat-warning { background: var(--warn-bg); border: 1px solid var(--warn-border);

    .chat-messages { overflow-y: auto; margin-bottom: 12px; max-height: 380px;

    .chat-bubble { max-width: 85%; border-radius: 4px; padding: 8px 12px; font-size: 13px; }
    .chat-bubble.player { background: var(--warn-bg); border: 1px solid var(--warn-border);
                          border-left: 3px solid var(--accent); color: var(--text); }

    .chat-text   { line-height: 1.55; white-space: pre-wrap; }
    .chat-input-row { display: flex; gap: 8px; align-items: flex-end; }
    .chat-textarea { flex: 1; background: var(--bg-input); border: 1px solid var(--border);
                     border-radius: 4px; color: var(--text); font-family: inherit; font-size: 13px;
                     padding: 8px 10px; resize: none; min-height: 40px; max-height: 120px; line-height: 1.4; }
    .chat-textarea::placeholder { color: var(--text-dim); }
    .chat-textarea:focus { outline: none; border-color: var(--accent); }
    .chat-send { background: var(--accent); border: none; color: var(--accent-contrast); border-radius: 4px;
                 height: 36px; padding: 0 16px; display: flex; align-items: center; justify-content: center;
                 flex-shrink: 0; font-size: 13px; font-weight: 800; text-transform: uppercase; }
    .chat-send:hover:not(:disabled) { background: var(--accent-hover); }
    .chat-send:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Dialog ── */
    dialog { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
             color: var(--text); padding: 20px; width: 480px; max-width: 90vw; font-family: inherit;
             box-shadow: 0 20px 50px rgba(0,0,0,.5); }
    [data-theme="light"] dialog { box-shadow: 0 20px 50px rgba(0,0,0,.18); }
    dialog::backdrop { background: rgba(0,0,0,.6); }
    dialog h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 900;
                letter-spacing: .05em; text-transform: uppercase; margin-bottom: 6px; color: var(--text); }
    dialog p.desc { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
    .dialog-textarea { width: 100%; background: var(--bg-input); border: 1px solid var(--border);
                       border-radius: 4px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 11px;
                       padding: 8px 10px; resize: vertical; min-height: 180px; }
    .dialog-textarea:focus { outline: none; border-color: var(--accent); }
    .dialog-error   { font-size: 11px; color: var(--bad); margin-top: 6px; min-height: 16px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

    /* ── Empties ── */
    .empty-state { text-align: center; padding: 48px 0; color: var(--text-dim); font-size: 13px; }
    .empty-state p + p { margin-top: 4px; font-size: 11px; color: var(--text-dim); opacity: .6; }
    .no-issues { text-align: center; padding: 48px 0; font-size: 13px; color: var(--ok); opacity: .6; }

    /* ── Player notes ── */
    .player-notes { font-size: 12px; color: var(--text-dim); font-style: italic;
                    border-top: 1px solid var(--border-sub); padding-top: 10px; margin-top: -4px; }

    /* ── Location bar ── */
    .loc-bar { display: flex; align-items: center; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
    .loc-sep  { color: var(--text-dim); padding: 0 2px; font-size: 13px; }
    .loc-btn  { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted);
                border-radius: 3px; padding: 3px 12px; height: 28px;
                font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700;
                letter-spacing: .05em; text-transform: uppercase; cursor: pointer; transition: background .12s, color .12s; }
    .loc-btn:hover:not(.active) { background: var(--border); color: var(--text); }
    .loc-btn.active { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); font-weight: 800; }

    /* ── Science location chips ── */
    .sci-loc-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .sci-loc-chip  { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500;
                     color: var(--text-dim); background: var(--bg-input);
                     border: 1px solid var(--border-sub); border-radius: 2px; padding: 1px 5px;
                     white-space: nowrap; }

    /* ── Narrow screens ── */
    @media (max-width: 720px) {
      .science-grid.cols-2 { grid-template-columns: 1fr; }
      .research-grid       { grid-template-columns: 1fr; }
      .step-io-grid        { grid-template-columns: 1fr; }
    }
  </style>
</head>

<script>
// ── Encode / Decode ─────────────────────────────────────────────────────────

function encodeState(state) {
  const json = JSON.stringify(state);
  const bytes = new TextEncoder().encode(json);
  const binary = Array.from(bytes, b => String.fromCharCode(b)).join('');
  return btoa(binary);
}

function decodeState(value) {
  try {
    const binary = atob(value.trim());
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch {
    return JSON.parse(value); // backward compat: plain JSON
  }
}

// ── Constants ────────────────────────────────────────────────────────────────

const STORAGE_KEY = 'factorio_engineer_state';

const PLANET_LABELS = { nauvis:'Nauvis', vulcanus:'Vulcanus', fulgora:'Fulgora', gleba:'Gleba', aquilo:'Aquilo' };

  const lbl = labelOverride ?? PLANET_LABELS[id] ?? id;
  return { id, type, label: lbl, lines: [], bus_items: [], targets: {}, bottlenecks: [], next_steps: [] };
}

    quality: 'normal',

    module_tier: 2,             // 1 | 2 | 3

// Research-tech → recipe-list map; mirror of PRODUCTIVITY_RESEARCH in cli.py.
// The empty recipe list for mining-productivity is intentional: it's a miner-
// wide bonus, not a recipe-keyed bonus.  Used for UI labels, rendering, and

  'scrap-recycling-productivity':       { label: 'Scrap Recycling',     recipes: ['scrap-recycling'],                                                 sa: true  },
  'processing-unit-productivity':       { label: 'Processing Unit',     recipes: ['processing-unit'],                                                 sa: true  },
  'plastic-bar-productivity':           { label: 'Plastic Bar',         recipes: ['plastic-bar', 'bioplastic'],                                       sa: true  },
  'rocket-fuel-productivity':           { label: 'Rocket Fuel',         recipes: ['rocket-fuel', 'rocket-fuel-from-jelly', 'ammonia-rocket-fuel'],    sa: true  },
  'asteroid-productivity':              { label: 'Asteroid Crushing',   recipes: [
    'carbonic-asteroid-crushing', 'oxide-asteroid-crushing', 'metallic-asteroid-crushing',
    'advanced-carbonic-asteroid-crushing', 'advanced-oxide-asteroid-crushing', 'advanced-metallic-asteroid-crushing',
  ], sa: true },
  'rocket-part-productivity':           { label: 'Rocket Part',         recipes: ['rocket-part'],                                                     sa: true  },

const SCIENCE_ORDER = [
  'automation-science-pack','logistic-science-pack','military-science-pack',
  'chemical-science-pack','production-science-pack','utility-science-pack',
  'space-science-pack','metallurgic-science-pack','agricultural-science-pack',

// Official Factorio science pack colors (rgb). Edge cases adjusted:
//   space (255,253,253→near-white), cryogenic (0,20,255→too-dark blue),
//   promethium (30,26,78→near-black) — all shifted to visible mid-range values.
const SCIENCE_COLORS = {
  'automation-science-pack':      [255,  0,  0],
  'logistic-science-pack':        [  0,255, 11],
  'military-science-pack':        [146,166,230],

  'production-science-pack':      [168,  0,255],
  'utility-science-pack':         [255,226,  0],
  'space-science-pack':           [175,195,255],  // adjusted from near-white

  'electromagnetic-science-pack': [255,  0,145],

  'promethium-science-pack':      [115, 95,215],  // adjusted from near-black

// Pack identity is a color swatch only; bar fill carries status (no icons).
function sciColor(name) {
  const [r,g,b] = SCIENCE_COLORS[name] || [128,128,128];
  return `rgb(${r},${g},${b})`;
}

const MACHINE_NAMES = {
  'assembling-machine-1':'Assembler 1','assembling-machine-2':'Assembler 2',

  'chemical-plant':'Chemical Plant','oil-refinery':'Oil Refinery',
  'centrifuge':'Centrifuge','rocket-silo':'Rocket Silo',
  'electric-mining-drill':'Mining Drill','big-mining-drill':'Big Mining Drill',
  'pumpjack':'Pumpjack','offshore-pump':'Offshore Pump',
  'foundry':'Foundry','electromagnetic-plant':'Electromagnetic Plant',
  'cryogenic-plant':'Cryogenic Plant',
  'biochamber':'Biochamber','crusher':'Crusher',

const BELT_COLORS = { yellow:'#d4a817', red:'#c84040', blue:'#4060c8', turbo:'#40c8b8' };
const BELT_THROUGHPUT = { yellow: 900, red: 1800, blue: 2700, turbo: 3600 };
const PUMP_THROUGHPUT = { normal: 72000, uncommon: 93600, rare: 115200, epic: 136800, legendary: 180000 };
const FLUID_ITEM_IDS = new Set([

// ── Helpers ──────────────────────────────────────────────────────────────────

function label(id) {
  return id.replace(/-science-pack$/, ' Science').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}
function machineLabel(id) { return MACHINE_NAMES[id] || label(id); }
function humanizeText(text) {
  return String(text).replace(
    /\bAM[123]\b|assembling-machine-[123]|\b[a-z]+(?:-[a-z0-9]+)+/g,
    t => MACHINE_NAMES[t] || label(t),
  );
}
function pct(actual, target) {
  if (!target) return 100;
  return Math.min(100, Math.max(0, Math.round((actual / target) * 100)));
}
function statusClass(p) { return p >= 100 ? 'ok' : p >= 75 ? 'warn' : 'bad'; }
function statusColor(p) { return p >= 100 ? 'var(--ok)' : p >= 75 ? 'var(--warn)' : 'var(--bad)'; }
function sortedScienceKeys(keys) {
  return [...keys].sort((a, b) => {
    const ia = SCIENCE_ORDER.indexOf(a), ib = SCIENCE_ORDER.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1; if (ib === -1) return -1;
    return ia - ib;
  });
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtN(n) {
  const v = Number.isInteger(n) ? n : +n.toFixed(1);
  return v.toLocaleString('en-US');
}
function fmtMC(n) {
  if (n == null) return '';
  if (Math.abs(n - Math.round(n)) < 1e-4) return Math.round(n).toLocaleString('en-US');
  return (+n.toFixed(2)).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtRB(rate, beltName) {
  const n = +rate;
  const tp = BELT_THROUGHPUT[beltName] ?? 1800;
  return `${fmtN(n)}/min <span style="color:var(--text-dim)">(${(n/tp).toFixed(2)} ${beltName} belt)</span>`;
}
function fmtFluid(rate) {
  const n = +rate;
  const tp = PUMP_THROUGHPUT[STATE.machine_quality] ?? 72000;
  return `${fmtN(n)}/min <span style="color:var(--text-dim)">(${(n/tp).toFixed(2)} pump)</span>`;
}
function fmtUnitOnly(rate, beltName) {
  const n = +rate;
  const tp = BELT_THROUGHPUT[beltName] ?? 1800;
  return `${(n/tp).toFixed(2)} ${beltName} belt`;
}
function fmtFluidUnitOnly(rate) {
  const n = +rate;
  const tp = PUMP_THROUGHPUT[STATE.machine_quality] ?? 72000;
  return `${(n/tp).toFixed(2)} pump`;
}
function fmtPower(kw) {
  if (kw == null || kw === 0) return null;
  if (kw < 1000) return `${+kw.toFixed(1)} kW`;
  return `${+(kw / 1000).toFixed(2)} MW`;
}
function fmtAgo(iso) {
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return null;
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60)    return 'just now';
  if (s < 3600)  return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}
function summarizeCliArgs(args) {
  if (!args || typeof args !== 'object') return null;
  const parts = [];
  if (args.rate != null) parts.push(`${args.rate}/min`);
  else if (args.machines != null) parts.push(`${args.machines} machines`);
  else if (args.step_machines && typeof args.step_machines === 'object') {
    const s = Object.entries(args.step_machines)
      .map(([r, n]) => `${n}× ${label(r)}`).join(', ');
    if (s) parts.push(s);
  } else if (Array.isArray(args.targets) && args.targets.length) {
    parts.push(args.targets.map(t => `${label(t.item)} ${t.rate}/min`).join(' + '));
  }
  if (args.assembler != null) parts.push(`AM${args.assembler}`);
  if (args.machine_quality && args.machine_quality !== 'normal') parts.push(args.machine_quality);
  return parts.length ? parts.join(' · ') : null;
}
function modChip(m) {
  const abbr = {prod: 'P', speed: 'S', efficiency: 'E'}[m.type] ?? m.type[0].toUpperCase();
  const tCls = {prod: 'type-prod', speed: 'type-speed', efficiency: 'type-eff'}[m.type] ?? '';
  const qdot = m.quality !== 'normal' ? `<span class="qdot q-${m.quality}">◆</span>` : '';
  return `<span class="mod-chip ${tCls}"><span>${m.count}×${abbr}${m.tier}${qdot}</span></span>`;
}
function bcnChip(b, housingQ) {
  const houseDot = housingQ !== 'normal' ? `<span class="qdot q-${housingQ}">◆</span>` : '';
  const modsHtml = (b.modules ?? []).map(m => {
    const abbr = {speed: 'S', efficiency: 'E'}[m.type] ?? m.type[0].toUpperCase();
    const color = {speed: '#009FFF', efficiency: '#4CAF50'}[m.type] ?? '#aaa';
    const qdot  = m.quality !== 'normal' ? `<span class="qdot q-${m.quality}">◆</span>` : '';
    return `<span style="color:${color}">${m.count}×${abbr}${m.tier}${qdot}</span>`;
  }).join('');
  return `<span class="bcn-chip"><span>${b.count}×beacon${houseDot}</span><span class="bcn-sep">/</span><span style="display:inline-flex;align-items:center;gap:3px">${modsHtml}</span></span>`;
}

// ── Migration ─────────────────────────────────────────────────────────────────

function migrateState(state) {
  // Ensure research_levels exists so older exported states don't crash the UI.
  if (!state.research_levels || typeof state.research_levels !== 'object') {
    state.research_levels = {};
  }
  if (state.locations) return state; // already new format
  const loc = makeLocation('nauvis', 'planet');
  loc.lines       = state.lines       ?? [];
  loc.bus_items   = state.bus_items   ?? [];
  loc.targets     = state.targets     ?? {};
  loc.bottlenecks = state.bottlenecks ?? [];
  loc.next_steps  = state.next_steps  ?? [];
  const migrated  = { ...state, locations: [loc] };
  delete migrated.location;
  delete migrated.lines;
  delete migrated.bus_items;
  delete migrated.targets;
  delete migrated.bottlenecks;
  delete migrated.next_steps;
  return migrated;
}

async function saveState() {
  STATE.updated_at = new Date().toISOString();
  const encoded = encodeState(STATE);
  try { await window.storage?.set(STORAGE_KEY, encoded); return; } catch {}
  try { localStorage.setItem(STORAGE_KEY, encoded); } catch {}
}

async function loadState() {
  try { const r = await window.storage?.get(STORAGE_KEY); if (r?.value) return migrateState(decodeState(r.value)); } catch {}
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return migrateState(decodeState(raw)); } catch {}
  return null;
}

async function checkStorage() {
  if (!window.storage) { storageMode = localStorage ? 'local' : 'none'; return; }
  try {
    await window.storage.set('__ping__', '1');
    await window.storage.delete('__ping__');
    storageMode = 'cloud';
  } catch { storageMode = localStorage ? 'local' : 'none'; }
}

// Aggregate science targets across all locations (max per pack)
function allSciTargets() {
  const t = {};
  for (const loc of STATE.locations ?? [])
    for (const [k, v] of Object.entries(loc.targets ?? {}))
      t[k] = Math.max(t[k] ?? 0, v);
  return t;
}

// Aggregate science rates across all locations.
// Returns { packId: { total, allWip, byLoc: [{label, rate}] } }
// allWip is true when every contributing line has wip:true — used to exclude
// in-progress lines from the SPM bottleneck headline.
function allSciRates() {
  const targets = allSciTargets();
  const result = {};
  for (const loc of STATE.locations ?? []) {
    for (const line of loc.lines ?? []) {
      if (!(line.item in targets)) continue;
      const rate = line.effective_rate ?? line.target_rate ?? 0;
      if (!result[line.item]) result[line.item] = { total: 0, allWip: true, byLoc: [] };
      result[line.item].total += rate;
      if (!line.wip) result[line.item].allWip = false;
      const entry = result[line.item].byLoc.find(e => e.label === loc.label);
      if (entry) entry.rate += rate;
      else result[line.item].byLoc.push({ label: loc.label, rate });
    }
  }
  return result;
}

// Model how many labs are needed to consume `spm` science/min and the effective
// research throughput (eSPM).  Speed (ERS) sets labs-needed; productivity sets eSPM.
// See wiki Lab.md §Production requirements.  Pure — no DOM.
function computeLabLine(spm) {
  const cfg      = STATE.lab_config ?? DEFAULT_STATE.lab_config;
  const building = cfg.building === 'biolab' ? 'biolab' : 'lab';
  const quality  = cfg.quality ?? 'normal';
  const slots    = LAB_SLOTS[building];
  const bls      = LAB_BASE_SPEED[building][quality] ?? 1;
  const drain    = LAB_DRAIN[building];
  const levels   = STATE.research_levels ?? {};

  // Module effects across all slots (one chosen type fills every slot).
  const qmult = MODULE_QUALITY_MULT[cfg.module_quality] ?? 1;
  let modProd = 0, modSpeed = 0;
  if (cfg.module_type === 'prod') {
    modProd  = slots * (MODULE_PROD_BONUS[cfg.module_tier] ?? 0) * qmult;
    modSpeed = slots * (PROD_MODULE_SPEED_PEN[cfg.module_tier] ?? 0);
  } else if (cfg.module_type === 'speed') {
    modSpeed = slots * (SPEED_MODULE_BONUS[cfg.module_tier] ?? 0) * qmult;
  }

  // Beacons: speed only (2.0 beacons carry no productivity).
  const bc = cfg.beacon ?? {};
  let beaconSpeed = 0;
  if ((bc.count ?? 0) > 0) {
    beaconSpeed = (BEACON_EFFECTIVITY[bc.beacon_quality] ?? 1.5)
      * Math.sqrt(bc.count) * BEACON_SLOTS
      * (SPEED_MODULE_BONUS[bc.tier] ?? 0) * (MODULE_QUALITY_MULT[bc.module_quality] ?? 1);
  }

  const br  = (LAB_SPEED_CUM[Math.min(levels['lab-research-speed'] ?? 0, 6)] ?? 0) / 100;
  const mr  = modSpeed + beaconSpeed;
  const ers = (1 + br) * (1 + mr) * bls;
  const T   = Number(cfg.research_cycle_time) > 0 ? Number(cfg.research_cycle_time) : 60;
  const perLab     = 60 * ers * drain / T;          // packs/min consumed per lab
  const labsNeeded = perLab > 0 ? spm / perLab : 0;

  const researchProd = 0.10 * (levels['research-productivity'] ?? 0);
  const labProd      = modProd + researchProd;      // additive, uncapped
  const eSPM         = spm * (1 + labProd) / drain;
  const powerKw      = labsNeeded * LAB_POWER_KW[building];   // fractional, matches machine-count display

  return { building, quality, slots, bls, drain, ers, br, mr, beaconSpeed,
           modProd, modSpeed, labProd, researchProd, perLab, labsNeeded, eSPM,
           powerKw, T, moduleType: cfg.module_type ?? 'none', moduleTier: cfg.module_tier ?? 2 };
}

// UI persistence: whether the Science Targets section is expanded.
// Collapsed by default — only expanded if the user has previously opened it.
let scienceOpen = localStorage.getItem('science_open') === '1';

const ESPM_TITLE = 'Effective research throughput: SPM × (1 + lab productivity) ÷ pack drain (biolab consumes half the packs)';

function renderScience() {
  const targets = allSciTargets();
  const keys = sortedScienceKeys(Object.keys(targets));
  if (!keys.length) return '';
  const rates = allSciRates();

  const activeKeys   = keys.filter(k => !rates[k]?.allWip);
  const effectiveSPM = activeKeys.length ? Math.min(...activeKeys.map(k => rates[k]?.total ?? 0)) : 0;
  const targetSPM    = Math.max(...keys.map(k => targets[k]));
  const spmPct = pct(effectiveSPM, targetSPM);
  const spmCol = statusColor(spmPct);
  // Lab line consumes actual production; fall back to the target when nothing is built yet.
  const sciSPM = effectiveSPM > 0 ? effectiveSPM : targetSPM;
  const lab = computeLabLine(sciSPM);
  const showESPM = lab.labProd > 0 || lab.drain !== 1;   // hide when eSPM == SPM (redundant)
  // Effective SPM = min across active packs; name the pack holding the headline down.
  const limiter = (spmPct < 100 && activeKeys.length > 1)
    ? activeKeys.reduce((a, k) => ((rates[k]?.total ?? 0) < (rates[a]?.total ?? 0) ? k : a), activeKeys[0])
    : null;

  const headerRow = `
    <div class="science-header${scienceOpen ? ' open' : ''}" id="science-toggle"
         role="button" tabindex="0" aria-expanded="${scienceOpen}">
      <span class="science-header-main">
        <span class="research-chevron">${scienceOpen ? '▼' : '▶'}</span>
        <span>Science Targets</span>
        ${scienceOpen ? '' : `<span class="science-summary">
          <span style="color:${spmCol}">${Math.round(effectiveSPM)}</span><span style="color:var(--text-dim)"> / ${targetSPM} SPM</span>${showESPM ? `<span style="color:var(--text-dim)"> → </span><span style="color:var(--accent)" title="${ESPM_TITLE}">${Math.round(lab.eSPM)} eSPM</span>` : ''}
        </span>`}
      </span>
    </div>`;

  if (!scienceOpen) return `<div class="science-section">${headerRow}</div>`;

  const spmHeadline = `
    <div class="spm-headline">
      <span class="spm-number" style="color:${spmCol}">${Math.round(effectiveSPM)}</span>
      <span class="spm-sep">/</span>
      <span class="spm-target">${targetSPM}</span>
      <span class="spm-label">SPM</span>
      ${showESPM ? `<span class="spm-arrow">→</span>
      <span class="spm-espm" title="${ESPM_TITLE}">${Math.round(lab.eSPM)}</span>
      <span class="spm-label" title="${ESPM_TITLE}">eSPM</span>` : ''}
      ${limiter ? `<span class="spm-limiter">limited by ${esc(label(limiter))}</span>` : ''}
    </div>`;

  // Bars are normalized to the max target (targetSPM) so they read as overall-SPM
  // fractions — the "actual / targetSPM" label makes the basis explicit.
  const bars = keys.map(name => {
    const info   = rates[name];
    const actual = info?.total ?? 0;
    const p = pct(actual, targetSPM);
    const col = statusColor(p);
    const locCount = (STATE.locations ?? []).length;
    const locChips = locCount <= 1 ? '' : (info?.byLoc ?? []).map(e =>
      `<span class="sci-loc-chip">${esc(e.label)} ${fmtN(e.rate)}/min</span>`
    ).join('');
    return `
      <div class="science-bar">
        <div class="science-bar-header">
          <div class="science-name">
            <span class="sci-swatch" style="background:${sciColor(name)}"></span>
            ${esc(label(name))}${info?.allWip ? ' <span class="wip-badge">WIP</span>' : ''}
          </div>
          <div class="science-meta">
            <span class="rate-text">${fmtN(actual)} / ${targetSPM}/min</span>
            <span class="pct-text" style="color:${col}">${p}%</span>
          </div>
        </div>
        ${locChips ? `<div class="sci-loc-chips">${locChips}</div>` : ''}
        <div class="progress-track" style="margin-top:${locChips ? '6px' : '0'}">
          <div class="progress-fill" style="width:${p}%;background:${col}"></div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="science-section">
      ${headerRow}
      ${spmHeadline}
      <div class="science-grid${keys.length >= 4 ? ' cols-2' : ''}">${bars}</div>
      ${renderLabCard(lab, sciSPM)}
    </div>`;
}

// Common research cycle times (seconds) — picker values. Most techs are 30 or 60s.
const RESEARCH_TIMES = [10, 15, 30, 45, 60, 120];

// Read-only summary of the lab setup; players change it by asking Claude to update lab_config.
function labConfigSummary(lab, cfg) {
  const parts = [label(lab.building)];
  if (lab.quality && lab.quality !== 'normal') parts.push(label(lab.quality));
  if (cfg.module_type && cfg.module_type !== 'none') {
    const mq = cfg.module_quality && cfg.module_quality !== 'normal' ? ` ${cfg.module_quality}` : '';
    parts.push(`${lab.slots}× ${cfg.module_type}-${cfg.module_tier}${mq}`);
  } else {
    parts.push('no modules');
  }
  const bc = cfg.beacon ?? {};
  if ((bc.count ?? 0) > 0) {
    const bq = bc.beacon_quality && bc.beacon_quality !== 'normal' ? ` ${bc.beacon_quality}` : '';
    parts.push(`${bc.count}× beacon (speed-${bc.tier}${bq})`);
  }
  return parts.join(' · ');
}

// Research-lab card: labs needed to consume the science. Config is state-driven
// (player asks Claude to update lab_config); only research cycle time is a picker.
function renderLabCard(lab, sciSPM) {
  const cfg = STATE.lab_config ?? DEFAULT_STATE.lab_config;
  const power = fmtPower(lab.powerKw);

  const stats = [
    ['eSPM',      fmtN(+lab.eSPM.toFixed(1))],
    ['Lab speed', `${+lab.ers.toFixed(2)}×`],
    ['Lab prod',  `+${Math.round(lab.labProd*100)}%`],
    ['Packs/lab', `${+lab.perLab.toFixed(2)}/min`],
  ];
  if (lab.beaconSpeed > 0) stats.push(['Beacon spd', `+${Math.round(lab.beaconSpeed*100)}%`]);
  if (power) stats.push(['Power', power]);
  const statsHtml = stats.map(([k,v]) =>
    `<div class="lab-stat"><span class="lab-stat-k">${k}</span><span class="lab-stat-v">${esc(v)}</span></div>`).join('');

  const curT = +cfg.research_cycle_time || 60;
  const timeOpts = RESEARCH_TIMES.map(t => `<option value="${t}"${t===curT?' selected':''}>${t}s</option>`).join('');

  return `
    <div class="lab-card">
      <div class="lab-card-head">
        <span class="lab-card-title">Research Labs</span>
        <span class="lab-card-count">${fmtMC(lab.labsNeeded)} × ${label(lab.building)} · consume ${fmtN(Math.round(sciSPM))} SPM</span>
      </div>
      <div class="lab-config-row">
        <span class="lab-config-summary">${esc(labConfigSummary(lab, cfg))}</span>
        <div class="lab-ctl"><span class="lab-ctl-l">Research time</span>
          <select class="lab-select" data-lab="research_cycle_time">${timeOpts}</select></div>
      </div>
      <div class="lab-stats">${statsHtml}</div>
      <div class="lab-research">${renderResearch()}</div>
    </div>`;
}

function renderLocationBar() {

    return `<button class="loc-btn${i === activeLocationIdx ? ' active' : ''}" data-locidx="${i}">${esc(loc.label)}</button>`;
  };
  const planetBtns   = planets.map(btnFor).join('');
  const platformBtns = platforms.map(btnFor).join('');
  const sep = planets.length && platforms.length ? '<span class="loc-sep">|</span>' : '';
  return `
    <div class="loc-bar">
      ${planetBtns}${sep}${platformBtns}
    </div>`;
}

// Decide whether a line's cli_result is stale w.r.t. the current STATE.research_levels.
// Returns an array of tech names whose current level differs from what the line was
// calculated against, restricted to techs actually relevant to the line's recipes.
function lineStaleTechs(line) {
  const live = STATE.research_levels ?? {};
  const saved = line.cli_result?.research_levels ?? {};
  const steps = line.cli_result?.production_steps ?? [];
  const recipeKeys = new Set(steps.map(s => s.recipe));
  // A line uses miners if miners_needed has any non-offshore-pump entry.
  const miners = line.cli_result?.miners_needed ?? {};
  const usesMiners = Object.values(miners).some(m => m && m.machine && m.machine !== 'offshore-pump');

  const stale = [];
  for (const [tech, entry] of Object.entries(PRODUCTIVITY_RESEARCH)) {
    const relevant = tech === 'mining-productivity'
      ? usesMiners
      : entry.recipes.some(r => recipeKeys.has(r));
    if (!relevant) continue;
    const liveLvl  = live[tech]  ?? 0;
    const savedLvl = saved[tech] ?? 0;
    if (liveLvl !== savedLvl) stale.push(tech);
  }
  return stale;
}

function renderBusBalance() {
  const loc = currentLoc();
  // Supply: explicitly declared bus_items (player-declared rates)
  const supply = {};
  const busItemMap = {};
  for (const src of loc.bus_items ?? []) {
    supply[src.item] = (supply[src.item] ?? 0) + src.rate;
    busItemMap[src.item] = src;
  }

  // Demand: read bus_inputs from cli_result (set when --bus-item was used for this line)
  // Items present in a line's cli_args.logistics_items are routed via bots — exclude from bus.
  // Items present in a line's cli_args.direct_items are belt-fed from another line — also exclude.
  const demand = {};
  for (const line of loc.lines ?? []) {
    const offBusSet = new Set([
      ...(line.cli_args?.logistics_items ?? []),
      ...(line.cli_args?.direct_items ?? []),
    ]);
    for (const [item, rate] of Object.entries(line.cli_result?.bus_inputs ?? {})) {
      if (offBusSet.has(item)) continue;
      demand[item] = (demand[item] ?? 0) + rate;
    }
  }

  // Show all items with supply OR demand
  const busItems = [...new Set([...Object.keys(supply), ...Object.keys(demand)])];

  // Logistics network (bot-routed items): same supply/demand/net model, shown as a third
  // transport group alongside Belt Bus and Pipe Network.
  const { supply: lSupply, demand: lDemand } = computeLogisticsBalance(loc);
  const logiItems = [...new Set([...Object.keys(lSupply), ...Object.keys(lDemand)])]
    .filter(i => (lSupply[i] ?? 0) > 0 || (lDemand[i] ?? 0) > 0);

  if (!busItems.length && !logiItems.length) return '';

  // Shared compact card used by all three transport groups (belt / pipe / bots).
  // Every group displays net items/min + a supply/demand tooltip — one uniform format.
  const card = ({ rowLabel, net, usedPct, tip }) => {
    // Red only for a real deficit (demand exceeds supply, net < 0); a balanced/maxed
    // line (net >= 0, up to 100% load) is amber "at capacity", green below 80%.
    const sev = net < -1e-9 ? 'bad' : usedPct >= 80 ? 'warn' : 'ok';
    const loadCol = `var(--${sev})`;
    const netCol = net >= 0 ? 'var(--ok)' : 'var(--bad)';
    const netDisplay = `${net >= 0 ? '+' : ''}${fmtN(net)}`;
    return `
      <div class="bus-row bus-row--${sev}" title="${esc(tip)}">
        <div class="bus-row-top">
          <span class="bus-name">${esc(rowLabel)}</span>
          <span class="bus-net" style="color:${netCol}">${netDisplay}<span class="bus-net-unit">/min</span></span>
        </div>
        <div class="bus-row-bot">
          <div class="bus-bar-track">
            <div class="bus-bar-consumed" style="width:${usedPct}%;background:${loadCol}"></div>
          </div>
          <span class="bus-loadpct" style="color:${loadCol}">${Math.round(usedPct)}%</span>
        </div>
      </div>`;
  };

  const rowFor = (sup, dem, labelFn) => (item) => {
    const s = sup[item] ?? 0;
    const d = dem[item] ?? 0;
    const net = s - d;
    const usedPct = s > 0 ? Math.min(100, (d / s) * 100) : 100;
    const tip = `${fmtN(s)}/min supply  ·  ${fmtN(d)}/min demand`;
    return card({ rowLabel: labelFn(item), net, usedPct, tip });
  };
  const busRow  = rowFor(supply, demand, (i) => busItemMap[i]?.label ?? label(i));
  const logiRow = rowFor(lSupply, lDemand, (i) => label(i));

  // Sort tightest-first within each group so constrained/deficit items surface top-left.
  const loadIn = (sup, dem) => (item) => {
    const s = sup[item] ?? 0, d = dem[item] ?? 0;
    return s > 0 ? Math.min(100, (d / s) * 100) : 100;
  };
  const busLoad  = loadIn(supply, demand);
  const logiLoad = loadIn(lSupply, lDemand);
  const solids = busItems.filter(i => !(busItemMap[i]?.fluid)).sort((a, b) => busLoad(b) - busLoad(a));
  const fluids = busItems.filter(i =>  !!(busItemMap[i]?.fluid)).sort((a, b) => busLoad(b) - busLoad(a));
  const logi   = logiItems.sort((a, b) => logiLoad(b) - logiLoad(a));

  // Show sub-group labels only when more than one transport group is present.
  const showLabels = [solids.length, fluids.length, logi.length].filter(n => n > 0).length > 1;
  const group = (items, rowFn, labelClass, labelText) => items.length ? `
    <div class="bus-group">
      ${showLabels ? `<div class="bus-group-label ${labelClass}">${labelText}</div>` : ''}
      <div class="bus-grid">${items.map(rowFn).join('')}</div>
    </div>` : '';

  return `
    <div class="bus-section">
      <div class="group-label">Supply / Demand</div>
      ${group(solids, busRow, 'bus-group-label--belt', 'Belt Bus')}
      ${group(fluids, busRow, 'bus-group-label--pipe', 'Pipe Network')}
      ${group(logi, logiRow, 'bus-group-label--logi', 'Logistics Network')}
    </div>`;
}

// ── Logistics network ─────────────────────────────────────────────────────────
//
// Each line may declare:
//   line.reserve_items: [item-id, ...]      — items routed FROM this line into bots
//   line.cli_args.logistics_items: [item]   — items drawn FROM bots (mirror of bus_items)
//   line.cli_args.direct_items: [item]      — items belt-fed directly from another line.
//                                              Mirror of bus_items: excludes from bus AND
//                                              nets against the supplying line's reserve
//                                              (no bot traffic implied).
//
// Auto-rate per tagged reserve item, per line:
//   primary (item == line.item): supply = effective primary rate (full step output)
//   intermediate: supply = max(0, declared_step_machines - cli_step.machine_count)
//                          × (cli_step.outputs[item] / cli_step.machine_count)
//
// Supply contributions accumulate per item across all lines.

function findStepProducing(steps, item) {
  for (const s of steps) {
    const out = s.outputs?.[item];
    if (typeof out === 'number' && out > 0) return s;
  }
  return null;
}

function reserveRateFor(line, item) {
  const steps = line.cli_result?.production_steps ?? [];
  const step  = findStepProducing(steps, item);
  if (!step) return 0;

  // Primary: full effective production rate of this step.
  if (item === line.item) {
    const out = step.outputs?.[item];
    return typeof out === 'number' ? out : 0;
  }

  // Intermediate: surplus comes from over-sizing via --step-machines RECIPE=N.
  // The CLI is now authoritative — it emits step.excess_output_per_min directly.
  // New format: dict {item: rate} (per-co-product). Old format: scalar number
  // (assumed to apply to the step's primary output). Saved cli_results from
  // before this field shipped will report 0 — the correct fallback.
  const excess = step.excess_output_per_min;
  if (excess == null) return 0;
  if (typeof excess === 'number') return excess;
  return excess[item] ?? 0;
}

function computeLogisticsBalance(loc) {
  const supply = {};        // item → items/min from this location's reserves
  const demand = {};        // item → items/min drawn from bots
  const directDemand = {};  // item → items/min belt-fed from another line (nets against supply)
  for (const line of loc.lines ?? []) {
    for (const item of line.reserve_items ?? []) {
      const rate = reserveRateFor(line, item);
      supply[item] = (supply[item] ?? 0) + rate;
    }
    const logiSet = new Set(line.cli_args?.logistics_items ?? []);
    const directSet = new Set(line.cli_args?.direct_items ?? []);
    for (const [item, rate] of Object.entries(line.cli_result?.bus_inputs ?? {})) {
      if (logiSet.has(item)) {
        demand[item] = (demand[item] ?? 0) + rate;
      } else if (directSet.has(item)) {
        directDemand[item] = (directDemand[item] ?? 0) + rate;
      }
    }
  }
  // Net direct demand against the supplying line's reserve. If a direct
  // consumer fully covers the reserve, the item drops out of logistics
  // entirely (no bot traffic, no idle surplus).
  for (const [item, rate] of Object.entries(directDemand)) {
    if (supply[item] == null) continue;
    supply[item] = Math.max(0, supply[item] - rate);
    if (supply[item] === 0 && (demand[item] ?? 0) === 0) delete supply[item];
  }
  // Research consumption: any science pack supplied into the network is requested by the
  // labs (e.g. space science shipped down to Nauvis research). Model that draw as demand at
  // the science target rate so a reserved pack reads as consumed (100%), not idle surplus (0%).
  const sciTargets = allSciTargets();
  for (const item of Object.keys(supply)) {
    if (SCIENCE_ITEM_SET.has(item) && (sciTargets[item] ?? 0) > 0)
      demand[item] = (demand[item] ?? 0) + sciTargets[item];
  }
  return { supply, demand };
}

  const tabs = [

    <div class="tab-list" role="tablist">
      ${tabs.map(([id, txt]) => `<button class="tab-btn${activeTab===id?' active':''}" role="tab" aria-selected="${activeTab===id}" data-tab="${id}">${esc(txt)}</button>`).join('')}
    </div>`;
}

const SMELTING_MACHINES = new Set(['electric-furnace','stone-furnace','steel-furnace','foundry']);
const CIRCUIT_ITEMS     = new Set(['electronic-circuit','advanced-circuit','processing-unit']);
const SCIENCE_ITEM_SET  = new Set(SCIENCE_ORDER);
const CHEMICAL_MACHINES = new Set(['chemical-plant','oil-refinery','cryogenic-plant']);
// Item-id substring matches for semantic line groups (assembler-made goods the machine
// heuristic can't separate). Logistics is checked before Military.
const LOGISTICS_KEYS = ['transport-belt','underground-belt','splitter','inserter','loader',
  'rail','locomotive','cargo-wagon','fluid-wagon','roboport','logistic-robot',
  'construction-robot','robot-frame','pipe','offshore-pump','pump','train-stop'];
const MILITARY_KEYS = ['magazine','cannon-shell','shotgun-shell','artillery','grenade','turret',
  'flamethrower','rocket-launcher','land-mine','capsule','wall','gate','spidertron',
  'atomic-bomb','combat-robot','defender','distractor','destroyer','tank'];

// Lines-tab grouping. Order of checks is the precedence; "Other" is the residual.
const LINE_CATEGORY_ORDER = ['Science','Mining','Smelting','Chemical','Circuits','Logistics','Military','Other'];
function lineCategory(line) {
  if (SCIENCE_ITEM_SET.has(line.item)) return 'Science';
  const steps = line.cli_result?.production_steps ?? [];
  if (!steps.length) return 'Mining';            // raw resource — no crafting step
  if (CIRCUIT_ITEMS.has(line.item)) return 'Circuits';
  const m = steps[0]?.machine;
  if (m && SMELTING_MACHINES.has(m)) return 'Smelting';
  if (m && CHEMICAL_MACHINES.has(m)) return 'Chemical';
  const id = line.item;
  if (LOGISTICS_KEYS.some(k => id.includes(k))) return 'Logistics';
  if (MILITARY_KEYS.some(k => id.includes(k)))  return 'Military';
  return 'Other';
}

function renderOverview() {
  const loc = currentLoc();
  const lines = loc.lines ?? [];
  const busSection = renderBusBalance();

  // ── Top next step teaser ──
  const ns = loc.next_steps ?? [];
  const nextSection = ns.length ? `
    <div class="overview-section">
      <div class="group-label">Next Step</div>
      <div class="issue-item"><span style="color:var(--accent)">→</span><span>${esc(humanizeText(ns[0]))}</span>
        ${ns.length > 1 ? `<button class="overview-link" style="margin-left:auto;flex-shrink:0" data-goto-tab="issues">+${ns.length - 1} more →</button>` : ''}
      </div>
    </div>` : '';

  // ── Power ──
  const totalPowCeilMw = lines.reduce((acc, l) => acc + (l.cli_result?.total_power_mw_ceil ?? 0), 0);
  const totalPowMw     = lines.reduce((acc, l) => acc + (l.cli_result?.total_power_mw ?? 0), 0);
  const ceilDiffers = Math.abs(totalPowCeilMw - totalPowMw) >= 0.005;
  const powerSection = totalPowCeilMw > 0 ? `
    <div class="power-overview">
      <div class="power-overview-label">Power</div>
